{% extends "base.html" %}
{% block title %}500 · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="empty-state text-center py-5">
  <div class="display-3 fw-bold text-success">500</div>
  <h1 class="h3 mt-2">Something went wrong</h1>
  <p class="text-muted">An unexpected error occurred. Your data is safe - please try again in a moment.</p>
  <a class="btn btn-success" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.index') }}">Back to {{ 'dashboard' if current_user.is_authenticated else 'home' }}</a>
</div>
{% endblock %}
