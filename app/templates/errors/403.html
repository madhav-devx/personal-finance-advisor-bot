{% extends "base.html" %}
{% block title %}403 · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="empty-state text-center py-5">
  <div class="display-3 fw-bold text-success">403</div>
  <h1 class="h3 mt-2">Access denied</h1>
  <p class="text-muted">You do not have permission to view this page.</p>
  <a class="btn btn-success" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.index') }}">Back to {{ 'dashboard' if current_user.is_authenticated else 'home' }}</a>
</div>
{% endblock %}
